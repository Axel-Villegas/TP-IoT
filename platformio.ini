; Guardia Clima · TP Integrador IoT (TA 4k01 · UTN FRC · 2026)
;
; Versiones fijadas: las mismas con las que compilaron las prácticas de clase.
; Fijarlas evita que una actualización de una librería rompa el proyecto
; justo antes de la defensa.

[env:esp32doit-devkit-v1]
platform = espressif32 @ 7.1.3        ; trae el core Arduino-ESP32 2.0.17
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Si la placa se reinicia por un error, traduce las direcciones de memoria del
; volcado a archivo y linea del codigo (📌 Adicional: PlatformIO Docs, monitor_filters).
monitor_filters = esp32_exception_decoder

lib_deps =
    witnessmenow/UniversalTelegramBot @ 1.3.0
    bblanchon/ArduinoJson @ 7.4.3
    mathworks/ThingSpeak @ 2.1.1
    adafruit/DHT sensor library @ 1.4.7
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit SH110X @ 2.1.15
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BusIO @ 1.17.4
